<!doctype html>
<!-- 공유 미리보기(OG) 이미지 원본. 이 HTML 을 1200x630 으로 캡처해 app/opengraph-image.png 를 만든다. -->
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; font-family: "Apple SD Gothic Neo", "Pretendard", sans-serif;
    background: linear-gradient(180deg, #ffffff 0%, #edf5ff 100%); color: #0b1f3a;
    display: flex; flex-direction: column; justify-content: center; padding: 0 96px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 8px 24px rgba(21,101,249,.18); }
  .name { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; }
  .en { font-size: 20px; color: #5f6b7a; margin-top: 2px; }
  h1 { margin-top: 54px; font-size: 62px; line-height: 1.22; font-weight: 800; letter-spacing: -0.035em; }
  h1 span { color: #1565f9; }
  .steps { margin-top: 44px; display: flex; gap: 10px; }
  .steps div { font-size: 20px; font-weight: 600; color: #3e4a5c; background: #fff; border: 1px solid #e4ebf4; border-radius: 999px; padding: 10px 18px; }
</style>
<div class="brand"><img src="../assets/app-icon.png" alt=""><div><div class="name">커리어코치</div><div class="en">AI Career Insight Coach</div></div></div>
<h1>AI가 대신 쓰는 게 아니라,<br><span>당신의 경험에서 더 좋은 답을 발견하도록.</span></h1>
<div class="steps"><div>산업</div><div>기업</div><div>직무</div><div>경험</div><div>연결</div><div>인사이트</div><div>문서화</div></div>
